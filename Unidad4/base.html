<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Préstamos</title>
    <!-- 1. Bootstrap (Para el diseño y botones) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 2. Font Awesome (Para los iconos) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-light">

    <!-- 3. La Barra de Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        {% if num_control %}
        <span class="navbar-text text-white mx-3">{{ num_control }}{% if soy_admin %} (admin){% endif %}</span>
            <a class="nav-link text-white" href="/logout"><i class="fa-solid fa-right-from-bracket"></i> Salir</a>
        {% endif %}
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fa-solid fa-laptop-code"></i> Sistema de Préstamos
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link text-white" href="/"><i class="fa-solid fa-house"></i> Inicio</a>
            </div>
        </div>
    </nav>

    <!-- 4. El "hueco" donde irá el contenido de las demás páginas -->
    <div class="container mt-4">
    {% with mensajes = get_flashed_messages(with_categories=true) %}
    {% for categoria, texto in mensajes %}
    <div class="alert alert-{{ categoria }}">{{ texto }}</div>
    {% endfor %}
{% endwith %}
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
